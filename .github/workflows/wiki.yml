# Publica docs/wiki/ en la Wiki del repositorio cada vez que cambia en main.
# Requisito previo (una sola vez): crear manualmente la primera página de la Wiki
# desde GitHub para que exista el repositorio <repo>.wiki.git.
name: Publicar Wiki

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar docs/wiki con la Wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::warning::La Wiki aún no existe. Créala una vez desde la pestaña Wiki de GitHub y vuelve a ejecutar este workflow."
            exit 0
          fi
          rsync -a --delete --exclude ".git" docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios en la Wiki"
          else
            git commit -m "Publicar Wiki desde ${GITHUB_SHA::7}"
            git push
          fi
