# Proxy inverso delante de la API (E1-E2). En E3 lo sustituye el balanceador de GCP
# y en E4 la entrada gestionada de Cloud Run.
upstream api_upstream {
    server api:8080;
}

server {
    listen 80;

    # Tamaño máximo de adjuntos (alinear con MAX_UPLOAD_MB).
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check de la API. En E3 lo usará el balanceador de GCP.
    location = /healthz {
        proxy_pass http://api_upstream/healthz;
    }
}
